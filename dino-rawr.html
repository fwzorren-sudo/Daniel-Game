<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daniel-saurus Rawr! 🦖</title>
<style>
  :root { --sky1:#7ec8ff; --sky2:#bdeaff; --grass:#7ed957; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    /* full sky-to-grass gradient lives on the page so the paint layer shows over it */
    background:linear-gradient(#7ec8ff 0%, #bdeaff 55%, #d6f3ff 70%, #7ed957 70%, #5cba3a 100%);
    font-family:'Comic Sans MS','Comic Sans',Chalkboard,'Baloo',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none; cursor:default;
  }
  /* paint layer (persistent) sits under the dino layer */
  #paint { position:fixed; inset:0; display:block; z-index:1; }
  #game  { position:fixed; inset:0; display:block; z-index:2; }

  /* ---- Top buttons ---- */
  .btn {
    position:fixed; top:14px; z-index:30;
    width:60px; height:60px; border:none; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 4px 0 rgba(0,0,0,.18);
    font-size:30px; cursor:pointer; line-height:1;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  #mute  { right:14px; }
  #paintBtn { right:84px; }
  #paintBtn.on { background:#ffd166; box-shadow:0 4px 0 #d9a300; }

  /* ---- Dino counter badge ---- */
  #counter {
    position:fixed; top:14px; left:14px; z-index:30;
    background:rgba(255,255,255,.85); box-shadow:0 4px 0 rgba(0,0,0,.18);
    border-radius:34px; height:60px; padding:0 22px 0 14px;
    display:flex; align-items:center; gap:8px;
    font-size:30px; font-weight:bold; color:#3a3a3a; line-height:1;
  }
  #counter .n { color:#ff5d8f; min-width:1ch; }

  /* ---- Exit hint (for grown-ups) ---- */
  #exitHint {
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    z-index:30; color:rgba(0,0,0,.35); font-size:13px; pointer-events:none;
    background:rgba(255,255,255,.4); padding:4px 12px; border-radius:20px;
    transition:opacity .6s; opacity:.8;
  }

  /* ---- Start screen ---- */
  #start {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer;
    background:linear-gradient(#7ec8ff, #bdeaff 60%, #7ed957);
    text-align:center;
  }
  #start h1 {
    font-size:min(16vw,150px); color:#fff; line-height:1;
    text-shadow:0 6px 0 #ff9f1c, 0 10px 14px rgba(0,0,0,.25);
    animation:wob 1.6s ease-in-out infinite;
  }
  #start .dinos { font-size:min(20vw,170px); animation:bob 1.5s ease-in-out infinite; }
  #start .go {
    font-size:min(7vw,46px); color:#fff; background:#ff5d8f;
    padding:18px 46px; border-radius:60px; box-shadow:0 8px 0 #c2356a;
    animation:pulse 1.1s ease-in-out infinite;
  }
  #start small { color:rgba(255,255,255,.95); font-size:min(4vw,20px); max-width:80%; }
  @keyframes wob { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
</style>
</head>
<body>
  <canvas id="paint"></canvas>
  <canvas id="game"></canvas>
  <div id="counter" title="Dinos made">🦕<span class="n">0</span></div>
  <button id="paintBtn" class="btn" title="Color mode" aria-label="Color the dinos mode">🎨</button>
  <button id="mute" class="btn" title="Sound on/off" aria-label="Sound on or off">🔊</button>
  <div id="exitHint">Grown-ups: press <b>Esc</b> then <b>Shift</b>+<b>Q</b> to quit</div>

  <div id="start">
    <div class="dinos">🦕🦖</div>
    <h1>Daniel-saurus<br>Rawr!</h1>
    <div class="go">▶ Tap to Play!</div>
    <small>Mash any keys and click anywhere — make the dinosaurs roar! 🌋</small>
  </div>

<script>
"use strict";
(function () {
  // ============================================================= setup
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const paintCanvas = document.getElementById('paint');
  const pctx = paintCanvas.getContext('2d');
  const startScreen = document.getElementById('start');
  const muteBtn = document.getElementById('mute');
  const paintBtn = document.getElementById('paintBtn');
  const counterEl = document.getElementById('counter').querySelector('.n');
  const exitHint = document.getElementById('exitHint');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [canvas, paintCanvas]) {
      c.width = Math.floor(W * DPR);
      c.height = Math.floor(H * DPR);
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // resizing wipes the canvas bitmap, so the painting starts fresh
  }
  window.addEventListener('resize', resize);
  resize();

  // tiny seedless RNG helpers
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const TAU = Math.PI * 2;

  // ============================================================= audio
  // All sound is synthesized with the Web Audio API — no audio files needed.
  let muted = false;
  let audio = null;
  function ensureAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume();
    return audio;
  }

  // a reused noise buffer gives the roars a breathy, growly texture
  let noiseBuf = null;
  function getNoise(ac) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  // Different dinosaurs have different "voices": a big stompy roar, a regular
  // roar, or a cute little baby chirp. Each roar picks one at random.
  const VOICES = [
    { base: [60, 85],   dur: [0.7, 1.0], filt: [1200, 380], vol: 0.55, growl: 0.5 }, // big
    { base: [100, 150], dur: [0.45, 0.7], filt: [1700, 520], vol: 0.5,  growl: 0.4 }, // mid
    { base: [240, 340], dur: [0.18, 0.34], filt: [3200, 1400], vol: 0.4, growl: 0.15, baby: true }, // baby
  ];

  function roar() {
    const ac = ensureAudio(); if (!ac || muted) return;
    const t = ac.currentTime;
    const v = pick(VOICES);
    const dur = rnd(v.dur[0], v.dur[1]);
    const base = rnd(v.base[0], v.base[1]);

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(v.filt[0], t);
    lp.frequency.exponentialRampToValueAtTime(v.filt[1], t + dur);

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v.vol, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g).connect(ac.destination);

    // main growly tone with a pitch sweep
    const osc = ac.createOscillator();
    osc.type = v.baby ? 'triangle' : 'sawtooth';
    if (v.baby) { // chirp up then down — cute
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(base * 1.8, t + dur * 0.4);
      osc.frequency.exponentialRampToValueAtTime(base * 1.1, t + dur);
    } else {       // roar starts high, falls to a growl
      osc.frequency.setValueAtTime(base * 2.2, t);
      osc.frequency.exponentialRampToValueAtTime(base * 0.7, t + dur);
    }

    // creature-y wobble
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = rnd(14, 28);
    const lfoGain = ac.createGain(); lfoGain.gain.value = base * 0.5;
    lfo.connect(lfoGain).connect(osc.frequency);
    osc.connect(lp);
    osc.start(t); lfo.start(t);
    osc.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);

    // breathy noise growl layered on top
    if (v.growl > 0.001) {
      const ns = ac.createBufferSource();
      ns.buffer = getNoise(ac); ns.loop = true;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(v.growl * 0.4, t + 0.06);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      ns.connect(ng).connect(lp);
      ns.start(t); ns.stop(t + dur + 0.05);
    }
  }

  function pop() {
    const ac = ensureAudio(); if (!ac || muted) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = 'triangle';
    const f = rnd(500, 1100);
    osc.frequency.setValueAtTime(f, t);
    osc.frequency.exponentialRampToValueAtTime(f * 2.4, t + 0.09);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(g).connect(ac.destination);
    osc.start(t); osc.stop(t + 0.2);
  }

  function setMuted(m) {
    muted = m;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMuted(!muted);
    if (!muted) pop();
  });

  // ============================================================= counter
  let dinoCount = 0;
  function bumpCounter() { dinoCount++; counterEl.textContent = dinoCount; }

  // ============================================================= color mode
  // In color mode, dragging finger-paints rainbow trails, and tapping a
  // dinosaur splashes a bright color onto it.
  let paintMode = false;
  paintBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    paintMode = !paintMode;
    paintBtn.classList.toggle('on', paintMode);
    if (!paintMode) pctx.clearRect(0, 0, W, H); // tidy up the painting
    pop();
  });

  const PAINT_COLORS = ['#ff5d8f','#ffb703','#ffd166','#06d6a0','#4cc9f0',
                        '#9b5de5','#ff7b00','#ef476f','#118ab2','#f15bb5'];
  let brushHue = 0;
  function paintDot(x, y) {
    brushHue = (brushHue + 1) % PAINT_COLORS.length;
    const r = rnd(26, 52);
    pctx.save();
    pctx.globalAlpha = 0.85;
    pctx.fillStyle = PAINT_COLORS[brushHue];
    pctx.beginPath(); pctx.arc(x, y, r, 0, TAU); pctx.fill();
    pctx.restore();
  }

  // Tinted-emoji cache: redraw an emoji recolored with a solid hue using
  // 'source-atop' compositing, then reuse the offscreen canvas for that combo.
  const TINT_SIZE = 256;
  const tintCache = new Map();
  function tintedEmoji(emoji, color) {
    const key = emoji + color;
    let c = tintCache.get(key);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = TINT_SIZE;
      const o = c.getContext('2d');
      o.font = (TINT_SIZE * 0.82) + 'px serif';
      o.textAlign = 'center'; o.textBaseline = 'middle';
      o.fillText(emoji, TINT_SIZE / 2, TINT_SIZE / 2);
      o.globalCompositeOperation = 'source-atop';
      o.globalAlpha = 0.6;
      o.fillStyle = color;
      o.fillRect(0, 0, TINT_SIZE, TINT_SIZE);
      tintCache.set(key, c);
    }
    return c;
  }

  // ============================================================= sprites
  const DINOS = ['🦕','🦖','🐉','🐲','🦎','🐊'];
  const POP_EMOJI = ['🥚','⭐','💥','❤️','🌟','🍃','🌺','🦴','✨','🌈'];
  const LETTER_COLORS = ['#ff5d8f','#ffb703','#06d6a0','#4cc9f0','#9b5de5','#ff7b00','#ef476f','#118ab2'];
  const CONFETTI_COLORS = ['#ff5d8f','#ffd166','#06d6a0','#4cc9f0','#9b5de5','#ff7b00','#ffffff'];

  // pools of live things
  const dinos = [];     // popped-in dinosaurs (fade out)
  const roamers = [];   // dinos walking across screen
  const bigText = [];   // big letters/numbers
  const parts = [];     // confetti particles
  const floaters = [];  // emoji bursts (eggs/stars) from clicks

  const MAX_DINOS = 26; // auto-clear keeps the screen from overcrowding

  function spawnDino(x, y, letter) {
    const size = rnd(80, 170);
    dinos.push({
      x, y, size,
      emoji: pick(DINOS),
      rot: rnd(-0.35, 0.35),
      vrot: rnd(-0.02, 0.02),
      born: now,
      life: rnd(3.2, 5.0),     // seconds before it fades away (auto-clear)
      pop: 0,                   // 0..1 grow-in animation
      hue: pick(LETTER_COLORS),
      letter: letter || null,
      tint: null,               // set when colored in color mode
    });
    if (dinos.length > MAX_DINOS) dinos.shift(); // drop oldest
    bumpCounter();
    roar();
  }

  function spawnBigText(ch) {
    bigText.push({
      ch,
      x: rnd(W * 0.2, W * 0.8),
      y: rnd(H * 0.25, H * 0.7),
      color: pick(LETTER_COLORS),
      born: now, life: 1.6, pop: 0,
      rot: rnd(-0.2, 0.2),
    });
  }

  // confetti modeled on canvas-confetti physics (origin/spread/velocity/gravity)
  function confettiBurst(x, y, count) {
    count = count || 26;
    const spread = 360, startVel = rnd(7, 12);
    for (let i = 0; i < count; i++) {
      const ang = rnd(0, TAU);
      const v = startVel * rnd(0.4, 1);
      parts.push({
        x, y,
        vx: Math.cos(ang) * v,
        vy: Math.sin(ang) * v - rnd(2, 5),
        g: 0.35, decay: 0.92,
        size: rnd(7, 15),
        color: pick(CONFETTI_COLORS),
        rot: rnd(0, TAU), vrot: rnd(-0.3, 0.3),
        shape: pick(['square','circle','star']),
        born: now, life: rnd(1.0, 1.8),
      });
    }
  }

  function emojiBurst(x, y) {
    const n = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
      const ang = rnd(-Math.PI, 0); // upward fan
      const v = rnd(5, 11);
      floaters.push({
        emoji: pick(POP_EMOJI),
        x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - rnd(2, 5),
        g: 0.3, size: rnd(34, 60), rot: rnd(-0.3, 0.3), vrot: rnd(-0.2, 0.2),
        born: now, life: rnd(1.1, 1.8),
      });
    }
  }

  // find the topmost dino (roaming or popped) under a point, if any
  function dinoAt(x, y) {
    for (const r of roamers) {
      if (Math.abs(r.x - x) < r.size * 0.5 && Math.abs(r.y - y) < r.size * 0.5) return r;
    }
    for (let i = dinos.length - 1; i >= 0; i--) {
      const d = dinos[i];
      if (Math.abs(d.x - x) < d.size * 0.5 && Math.abs(d.y - y) < d.size * 0.5) return d;
    }
    return null;
  }

  function clickAt(x, y) {
    const hit = dinoAt(x, y);
    if (paintMode) {
      paintDot(x, y);
      if (hit) {                       // color the dino & make it cheer
        hit.tint = pick(PAINT_COLORS);
        if (hit.vy !== undefined && hit.baseY !== undefined) hit.vy = -12;
        roar();
      } else {
        pop();
      }
      return;
    }
    confettiBurst(x, y);
    emojiBurst(x, y);
    pop();
    if (hit && hit.baseY !== undefined) { hit.vy = -12; roar(); } // pet a roamer
  }

  // ============================================================= roamers
  let roamTimer = 0, roamEvery = rnd(2.5, 5);
  function spawnRoamer() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const size = rnd(90, 150);
    const groundY = H * 0.72 + rnd(0, H * 0.22);
    roamers.push({
      emoji: pick(DINOS),
      size,
      x: dir === 1 ? -size : W + size,
      y: groundY,
      baseY: groundY,
      vx: dir * rnd(1.2, 2.6),
      vy: 0,
      dir,
      step: rnd(0, TAU), // for a little walking bob
      tint: null,        // set when colored in color mode
    });
  }

  // ============================================================= drawing
  function drawScenery() {
    // soft sun
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff7c2';
    ctx.beginPath(); ctx.arc(W * 0.84, H * 0.16, 55, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(W * 0.84, H * 0.16, 80, 0, TAU); ctx.fill();
    ctx.restore();
    // a couple of clouds
    cloud(W * 0.2, H * 0.18, 1);
    cloud(W * 0.55, H * 0.1, 0.7);
  }
  function cloud(x, y, s) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const [dx, dy, r] of [[0,0,30],[34,6,26],[-30,8,24],[8,-16,24]]) {
      ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawEmoji(emoji, x, y, size, rot, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  }

  // draw a dinosaur, optionally recolored (tint), honoring translate+rotate
  function drawSprite(emoji, tint, x, y, size, rot, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (tint) {
      const c = tintedEmoji(emoji, tint);
      const box = size * 1.22; // match the glyph size of plain fillText
      ctx.drawImage(c, -box / 2, -box / 2, box, box);
    } else {
      ctx.font = size + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 0, 0);
    }
    ctx.restore();
  }

  function star(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * TAU / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      const a2 = a + TAU / 10;
      ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
    }
    ctx.closePath();
  }

  // ============================================================= loop
  let now = 0, last = 0;
  function frame(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);
    last = ts; now += dt;

    ctx.clearRect(0, 0, W, H);
    drawScenery();

    // roamers
    roamTimer += dt;
    if (roamTimer > roamEvery && roamers.length < 5) {
      roamTimer = 0; roamEvery = rnd(2.5, 5.5); spawnRoamer();
    }
    for (let i = roamers.length - 1; i >= 0; i--) {
      const r = roamers[i];
      r.x += r.vx;
      r.step += dt * 8;
      r.vy += 0.6; r.y += r.vy;
      if (r.y > r.baseY) { r.y = r.baseY; r.vy = 0; }
      const bob = Math.sin(r.step) * 4;
      ctx.save();
      ctx.translate(r.x, r.y + bob);
      if (r.dir < 0) ctx.scale(-1, 1); // face travel direction
      drawSprite(r.emoji, r.tint, 0, 0, r.size, 0, 1);
      ctx.restore();
      if (r.x < -r.size * 1.5 || r.x > W + r.size * 1.5) roamers.splice(i, 1);
    }

    // popped dinos (grow in, hold, fade out)
    for (let i = dinos.length - 1; i >= 0; i--) {
      const d = dinos[i];
      const age = now - d.born;
      d.pop = Math.min(1, d.pop + dt * 6);
      d.rot += d.vrot;
      const ease = 1 + Math.sin(d.pop * Math.PI) * 0.15; // little overshoot bounce
      let alpha = 1;
      const fadeStart = d.life - 0.8;
      if (age > fadeStart) alpha = Math.max(0, 1 - (age - fadeStart) / 0.8);
      // colored halo
      ctx.save();
      ctx.globalAlpha = alpha * 0.25;
      ctx.fillStyle = d.hue;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.size * 0.6 * d.pop, 0, TAU); ctx.fill();
      ctx.restore();
      drawSprite(d.emoji, d.tint, d.x, d.y, d.size * d.pop * ease, d.rot, alpha);
      if (d.letter) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold ' + (d.size * 0.4) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.strokeStyle = d.hue; ctx.lineWidth = d.size * 0.05;
        ctx.strokeText(d.letter, d.x, d.y + d.size * 0.62);
        ctx.fillText(d.letter, d.x, d.y + d.size * 0.62);
        ctx.restore();
      }
      if (age > d.life) dinos.splice(i, 1);
    }

    // big letters/numbers
    for (let i = bigText.length - 1; i >= 0; i--) {
      const b = bigText[i];
      const age = now - b.born;
      b.pop = Math.min(1, b.pop + dt * 5);
      let alpha = 1;
      if (age > b.life - 0.6) alpha = Math.max(0, 1 - (age - (b.life - 0.6)) / 0.6);
      const size = Math.min(W, H) * 0.4 * b.pop;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.font = 'bold ' + size + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = size * 0.06; ctx.strokeStyle = '#fff';
      ctx.fillStyle = b.color;
      ctx.strokeText(b.ch, 0, 0);
      ctx.fillText(b.ch, 0, 0);
      ctx.restore();
      if (age > b.life) bigText.splice(i, 1);
    }

    // confetti
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      const age = now - p.born;
      p.vx *= p.decay; p.vy = p.vy * p.decay + p.g;
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      let alpha = 1;
      if (age > p.life - 0.5) alpha = Math.max(0, 1 - (age - (p.life - 0.5)) / 0.5);
      ctx.save();
      ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, TAU); ctx.fill(); }
      else if (p.shape === 'star') { star(ctx, p.size * 0.7); ctx.fill(); }
      else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
      if (age > p.life || p.y > H + 40) parts.splice(i, 1);
    }

    // emoji floaters
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      const age = now - f.born;
      f.vy += f.g; f.x += f.vx; f.y += f.vy; f.rot += f.vrot;
      let alpha = 1;
      if (age > f.life - 0.5) alpha = Math.max(0, 1 - (age - (f.life - 0.5)) / 0.5);
      drawEmoji(f.emoji, f.x, f.y, f.size, f.rot, alpha);
      if (age > f.life || f.y > H + 60) floaters.splice(i, 1);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ============================================================= input
  let started = false;

  function start() {
    if (started) return;
    started = true;
    ensureAudio();
    startScreen.style.display = 'none';
    // try fullscreen (best-effort; ignored if the browser refuses)
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch (e) {} }
    // welcome splash
    confettiBurst(W / 2, H / 2, 60);
    spawnDino(W / 2, H / 2);
    // fade the grown-up hint after a few seconds
    setTimeout(() => { exitHint.style.opacity = '0'; }, 6000);
  }

  startScreen.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });

  // pointer / touch anywhere = click fun
  let pointerDown = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (!started) { start(); return; }
    pointerDown = true;
    clickAt(e.clientX, e.clientY);
  });
  // dragging finger-paints a rainbow trail while in color mode
  canvas.addEventListener('pointermove', (e) => {
    if (!pointerDown || !paintMode) return;
    paintDot(e.clientX, e.clientY);
    const hit = dinoAt(e.clientX, e.clientY);
    if (hit) hit.tint = PAINT_COLORS[brushHue];
  });
  window.addEventListener('pointerup', () => { pointerDown = false; });
  window.addEventListener('pointercancel', () => { pointerDown = false; });

  // ---------------------------------------------- keyboard
  // Esc, then Shift+Q quits fullscreen (grown-up escape hatch).
  let escArmed = false, escTimer = null;

  window.addEventListener('keydown', (e) => {
    // Always allow the quit combo
    if (e.key === 'Escape') {
      escArmed = true;
      clearTimeout(escTimer);
      escTimer = setTimeout(() => { escArmed = false; }, 1500);
    }
    if (escArmed && (e.key === 'Q' || (e.key === 'q' && e.shiftKey))) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      return;
    }

    if (!started) { start(); return; }

    // Swallow keys that would otherwise navigate/scroll/close so a toddler
    // can mash freely. (Browsers won't let us block every shortcut, but this
    // covers the common accidents.)
    const safeToSwallow = !(e.ctrlKey || e.metaKey || e.altKey) || e.key.length === 1;
    if (safeToSwallow && e.key !== 'F11' && e.key !== 'Escape') {
      e.preventDefault();
    }

    // ignore pure modifier presses
    if (['Shift','Control','Alt','Meta','CapsLock','Tab'].includes(e.key)) return;

    const x = rnd(W * 0.12, W * 0.88);
    const y = rnd(H * 0.18, H * 0.62);

    if (/^[a-zA-Z0-9]$/.test(e.key)) {
      const ch = e.key.toUpperCase();
      spawnDino(x, y, ch);
      spawnBigText(ch);
    } else {
      spawnDino(x, y);
    }
  }, { passive: false });

  // keep canvas sized if fullscreen toggles
  document.addEventListener('fullscreenchange', resize);

  // first user gesture unlocks audio on some browsers
  window.addEventListener('pointerdown', ensureAudio, { once: true });
})();
</script>
</body>
</html>
